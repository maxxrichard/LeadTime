name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests pipelines scripts
      - name: Test
        run: pytest -q
      - name: Smoke-run the prototype (small)
        run: |
          cat > /tmp/ci.yaml <<'YAML'
          data: {n_synthetic_orders: 6000}
          model: {params: {n_estimators: 60, learning_rate: 0.1, num_leaves: 15, min_child_samples: 20, verbose: -1}}
          backtest: {n_folds: 2}
          ab: {n_bootstrap: 100}
          YAML
          leadtime -c /tmp/ci.yaml run-all --out /tmp/reports
          test -f /tmp/reports/backtest_report.md
