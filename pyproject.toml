[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtime"
version = "0.1.0"
description = "Processing-time and delivery-promise forecasting for an e-commerce fulfillment network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxx Richard Rahman" }]
keywords = ["forecasting", "quantile-regression", "lightgbm", "logistics", "delivery-promise", "pyspark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "joblib>=1.3",
  "pyyaml>=6",
  "typer>=0.9",
  "rich>=13",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
spark = ["pyspark>=3.4", "delta-spark>=2.4"]
mlflow = ["mlflow>=2.8"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "xgboost>=2.0", "matplotlib>=3.7", "mlflow>=2.8"]
all = ["leadtime[xgboost,spark,mlflow,plots,dev]"]

[project.scripts]
leadtime = "leadtime.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "pipelines", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]
